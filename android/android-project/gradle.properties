# Память сборщику. 2 ГБ хватает для этого модуля; без явного значения на больших
# зависимостях Gradle падает по OutOfMemory без внятного сообщения.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Параллельная сборка и кэш — ускоряют повторные прогоны.
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX обязателен для AGP 8.x.
android.useAndroidX=true

# Kotlin: официальный стиль каталогов.
kotlin.code.style=official

# Не генерировать BuildConfig без нужды (AGP 8 требует явного включения).
android.defaults.buildfeatures.buildconfig=false

# Распаковкой нативных библиотек управляет packaging { jniLibs { useLegacyPackaging } }
# в app/build.gradle. Свойство android.bundle.enableUncompressedNativeLibs здесь НЕ
# указывается: оно удалено в AGP 8.1, и его присутствие валит конфигурацию проекта
# ещё до сборки.
